name: Smoke check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application modules
        run: python -m compileall app.py radar

      - name: Import digest module
        run: python -c "import radar.digest; print('digest import ok')"
